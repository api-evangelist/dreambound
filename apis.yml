name: Dreambound
description: Dreambound is a career and technical education marketplace that helps job
  seekers discover, compare, and enroll in vocational training programs across healthcare,
  technology, business, and the skilled trades. The platform aggregates thousands of
  schools and hundreds of programs, letting students filter by location, schedule, format
  (online, hybrid, or in person), and price, with enrollment coaches guiding them into
  certifications such as certified nursing assistant, medical billing, phlebotomy, and
  sterile processing. The service is free for students and monetizes through schools and
  workforce partners who list and advertise their programs. Backed by Union Square Ventures,
  Collaborative Fund, and 8VC, Dreambound is added to the API Evangelist network as a
  company profile; it does not currently publish a public developer program, API, or
  documentation surface.
